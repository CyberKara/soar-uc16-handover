name: Release connector

# Publishes a GitHub release for each connectors/<name>-vX.Y.Z.tgz that has none
# yet (see scripts/release-connectors.sh). Touching this workflow or the script
# re-runs it, which backfills any version already in the repo.
on:
  push:
    branches: [main]
    paths:
      - "connectors/*.tgz"
      - ".github/workflows/release-connector.yml"
      - "scripts/release-connectors.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-connector
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish missing connector releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-connectors.sh
